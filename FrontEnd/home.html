<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Restaurante</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="home-container">
    <h1>Bienvenido al Sistema de Reservas y Pedidos</h1>
    <div class="user-info">
      <p><strong>Usuario:</strong> <span id="user-name"></span></p>
      <p><strong>Rol:</strong> <span id="user-rol"></span></p>
    </div>
    <div class="nav-buttons">
      <button id="btnMesas">Mesas</button>
      <button id="btnReservas">Reservas</button>
      <button id="btnProductos">Productos</button>
      <button id="btnPedidos">Pedidos</button>
    </div>
    <div class="form-group">
      <button id="cerrarSesionBtn">Cerrar sesión</button>
    </div>
    <div id="mensaje" class="error"></div>
  </div>
  <script src="js/home.js"></script>
</body>

</html>

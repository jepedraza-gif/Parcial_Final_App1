<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas - Restaurante</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="home.html">Inicio</a>
            <a href="reservas.html">Reservas</a>
        </nav>
        <h1>Gestión de Mesas</h1>

        <div class="card" id="listadoMesas">
            <h2>Listado de Mesas</h2>
            <table id="mesasTabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Número</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5">Cargando mesas...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card" id="crearMesaCard">
            <h2>Crear Mesa</h2>
            <form name="crearMesaForm">
                <div class="form-group">
                    <label for="numeroMesa">Número o nombre:</label>
                    <input type="text" name="numero" id="numeroMesa" required>
                </div>
                <div class="form-group">
                    <label for="capacidadMesa">Capacidad máxima:</label>
                    <input type="number" name="capacidad" id="capacidadMesa" min="1" required>
                </div>
                <div class="form-group">
                    <label for="estadoMesa">Estado inicial:</label>
                    <select name="estado" id="estadoMesa">
                        <option value="disponible">Disponible</option>
                        <option value="reservada">Reservada</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="fuera_servicio">Fuera de servicio</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit">Crear mesa</button>
                </div>
            </form>
            <div id="mensajeCrear" class="error"></div>
        </div>

        <div class="card" id="editarMesaCard">
            <h2>Editar Mesa</h2>
            <form name="editarMesaForm">
                <div class="form-group">
                    <label for="mesaIdEditar">ID de la mesa:</label>
                    <input type="number" name="id" id="mesaIdEditar" required>
                </div>
                <div class="form-group">
                    <label for="nuevaCapacidad">Nueva capacidad:</label>
                    <input type="number" name="capacidad" id="nuevaCapacidad" min="1">
                </div>
                <div class="form-group">
                    <button type="submit">Actualizar mesa</button>
                </div>
            </form>
            <div id="mensajeEditar" class="error"></div>
        </div>

        <div class="card" id="cambiarEstadoCard">
            <h2>Cambiar Estado de Mesa</h2>
            <form name="cambiarEstadoForm">
                <div class="form-group">
                    <label for="mesaIdEstado">ID de la mesa:</label>
                    <input type="number" name="id" id="mesaIdEstado" required>
                </div>
                <div class="form-group">
                    <label for="nuevoEstado">Nuevo estado:</label>
                    <select name="estado" id="nuevoEstado">
                        <option value="disponible">Disponible</option>
                        <option value="reservada">Reservada</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="fuera_servicio">Fuera de servicio</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit">Cambiar estado</button>
                </div>
            </form>
            <div id="mensajeEstado" class="error"></div>
        </div>
    </div>
    <script src="js/mesas.js"></script>
</body>
</html>
